services:
  postgres:
    image: postgres:17-alpine
    container_name: marketfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketfa
      POSTGRES_USER: marketfa
      POSTGRES_PASSWORD: marketfa_local_only
    ports:
      - "5432:5432"
    volumes:
      - marketfa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketfa -d marketfa"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]
volumes:
  marketfa-postgres-data:
