name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketfa
          POSTGRES_USER: marketfa
          POSTGRES_PASSWORD: marketfa_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketfa -d marketfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://marketfa:marketfa_local_only@localhost:5432/marketfa?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply formatting and expose changed source for bootstrap review
        shell: bash
        run: |
          pnpm format
          echo MARKETFA_FORMATTED_FILES_BEGIN
          while IFS= read -r file; do
            printf 'FILE_BEGIN:%s\\n' "$file"
            cat "$file"
            printf '\\nFILE_END:%s\\n' "$file"
          done < <(git diff --name-only)
          echo MARKETFA_FORMATTED_FILES_END
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test API and web startup against PostgreSQL
        shell: bash
        run: |
          pnpm --filter @marketfa/api start > /tmp/marketfa-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/live
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready
          pnpm --filter @marketfa/web preview -- --host 127.0.0.1 > /tmp/marketfa-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ | grep -q MarketFa; then exit 0; fi
            sleep 1
          done
          cat /tmp/marketfa-api.log /tmp/marketfa-web.log
          exit 1
