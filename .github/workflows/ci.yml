name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm install --no-frozen-lockfile
      - name: Emit generated lockfile for one-time repository bootstrap
        shell: bash
        run: |
          echo MARKETFA_LOCKFILE_BEGIN
          cat pnpm-lock.yaml
          echo MARKETFA_LOCKFILE_END
      - name: Preserve generated lockfile for repository review
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 3
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
