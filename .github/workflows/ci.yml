name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: marketfa
          POSTGRES_USER: marketfa_owner
          POSTGRES_PASSWORD: marketfa_owner_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketfa_owner -d marketfa"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://marketfa_runtime:marketfa_local_only@localhost:5432/marketfa
      DATABASE_URL_MIGRATION: postgresql://marketfa_owner:marketfa_owner_local_only@localhost:5432/marketfa
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting for auth files
        run: pnpm exec prettier --check apps/api/src/auth/*.ts apps/api/src/database/database.module.ts apps/api/src/sessions/session.service.ts apps/api/test/auth-guards.test.ts apps/api/test/cookie-policy.test.ts apps/api/test/csrf-controller.test.ts apps/api/test/session.service.integration.test.ts docs/security/AUTHENTICATION_SESSION_MODEL.md
      - name: Temporary membership formatter output
        run: pnpm exec prettier apps/api/test/membership-lifecycle.integration.test.ts
      - name: Check formatting for membership lifecycle files
        run: pnpm exec prettier --check apps/api/src/tenancy/membership.controller.ts apps/api/src/tenancy/membership.service.ts apps/api/test/membership-lifecycle.integration.test.ts
      - name: Check formatting for terminal lifecycle files
        run: pnpm exec prettier --check apps/api/src/tenancy/terminal.controller.ts apps/api/src/tenancy/terminal.service.ts apps/api/test/terminal.controller.test.ts apps/api/test/terminal-lifecycle.integration.test.ts
      - name: Check formatting for HTTP authorization matrix
        run: pnpm exec prettier --check apps/api/test/api-authorization.integration.test.ts
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Bootstrap non-superuser runtime role
        run: psql "$DATABASE_URL_MIGRATION" -v ON_ERROR_STOP=1 -f infra/postgres/init/01-roles.sql
      - name: Verify runtime role bootstrap and credential rotation
        shell: bash
        run: |
          set -euo pipefail
          APP_PASSWORD="$(openssl rand -hex 32)"
          psql "$DATABASE_URL_MIGRATION" -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" -f apps/api/database/bootstrap/create-runtime-role.sql
          echo "DATABASE_URL=postgresql://marketfa_runtime:${APP_PASSWORD}@localhost:5432/marketfa" >> "$GITHUB_ENV"
      - name: Bootstrap isolated authentication runtime role
        shell: bash
        run: |
          set -euo pipefail
          AUTH_PASSWORD="$(openssl rand -hex 32)"
          psql "$DATABASE_URL_MIGRATION" -v ON_ERROR_STOP=1 -v auth_password="$AUTH_PASSWORD" -f apps/api/database/bootstrap/create-auth-runtime-role.sql
          echo "AUTH_DATABASE_URL=postgresql://marketfa_auth_runtime:${AUTH_PASSWORD}@localhost:5432/marketfa" >> "$GITHUB_ENV"
      - name: Apply SQL migrations with owner connection
        run: pnpm --filter @marketfa/api db:migrate
      - run: pnpm test
      - run: pnpm build
      - name: Smoke test API and web startup against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          node apps/api/dist/main.js > /tmp/marketfa-api.log 2>&1 &
          API_PID=$!
          WEB_PID=""
          cleanup() {
            kill -9 "$API_PID" 2>/dev/null || true
            if [ -n "$WEB_PID" ]; then kill -9 "$WEB_PID" 2>/dev/null || true; fi
          }
          trap cleanup EXIT
          API_READY=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready > /dev/null; then
              API_READY=1
              break
            fi
            sleep 1
          done
          if [ "$API_READY" -ne 1 ]; then
            cat /tmp/marketfa-api.log
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/live
          curl --fail --silent http://127.0.0.1:3000/api/v1/health/ready
          (cd apps/web && exec ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173) > /tmp/marketfa-web.log 2>&1 &
          WEB_PID=$!
          WEB_READY=0
          for attempt in $(seq 1 30); do
            HTML="$(curl --fail --silent http://127.0.0.1:4173/ || true)"
            if [[ "$HTML" == *MarketFa* ]]; then
              WEB_READY=1
              break
            fi
            sleep 1
          done
          if [ "$WEB_READY" -ne 1 ]; then
            cat /tmp/marketfa-web.log
            exit 1
          fi
